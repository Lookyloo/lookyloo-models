[project]
name = "lookyloo-models"
version = "0.3.1"
description = "All the Pydantic models used across Lookyloo"
readme = "README.md"
authors = [
    { name = "Raphaël Vinot", email = "raphael.vinot@circl.lu" }
]
requires-python = ">=3.10, <4"
dependencies = [
    "dateparser>=1.4",
    "orjson>=3.11",
    "pydantic>=2.13",
    "ua-parser[regex]>=1.0",
]
license = "BSD-3-Clause"

[project.urls]
Repository = "https://github.com/Lookyloo/lookyloo-models"
Issues = "https://github.com/Lookyloo/lookyloo-models/issues"

[build-system]
requires = ["uv_build>=0.12,<0.13"]
build-backend = "uv_build"

[dependency-groups]
dev = [
    "ty>=0.0.69",
    "deptry>=0.25"
]
